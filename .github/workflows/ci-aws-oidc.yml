# GitHub Actions -> AWS via OIDC
# Repo SECRETS required:
#   AWS_ROLE_ARN, S3_BACKUP_BUCKET, KMS_CMK_ARN
#   AWS_REGION, CLUSTER_NAME  (optional; defaults used if missing)
name: ci-aws-oidc

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prove identity (assumed role, not access keys)
        run: aws sts get-caller-identity

      - name: Describe EKS cluster
        run: |
          aws eks describe-cluster \
            --name "${{ secrets.CLUSTER_NAME }}" \
            --query 'cluster.{name:name,status:status,version:version}' \
            --output table

      - name: List S3 backup bucket
        run: |
          aws s3 ls "s3://${{ secrets.S3_BACKUP_BUCKET }}/" --recursive

      - name: Write CI marker object to S3 (SSE-KMS)
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "yelb-ci oidc ok ${STAMP}" | aws s3 cp - \
            "s3://${{ secrets.S3_BACKUP_BUCKET }}/ci/oidc-${STAMP}.txt" \
            --sse aws:kms \
            --sse-kms-key-id "${{ secrets.KMS_CMK_ARN }}"
